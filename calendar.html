<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jazz Calendar | OKC Jazz Life</title><meta name="theme-color" content="#080e11"><style>
:root{color-scheme:dark;--bg:#080e11;--card:#121c20;--card2:#17262b;--line:#2a4148;--ink:#f3f8f7;--muted:#a9bdbf;--aqua:#35cec5}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}button,input,select{font:inherit}button{cursor:pointer}a{color:var(--aqua)}.wrap{max-width:850px;margin:auto;padding:12px 14px 60px}.toolbar{position:relative;display:flex;align-items:center;gap:10px;justify-content:space-between;padding:4px 0 13px}.toolbar h1{font-size:22px;margin:0;letter-spacing:-.025em}.todayBtn,.navbtn,.minor{border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--ink);padding:9px 12px}.todayBtn{color:var(--aqua);font-weight:700}.micro{font-size:12px;color:var(--muted)}.weekStrip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;margin:3px 0 10px}.daybtn{border:1px solid var(--line);border-radius:11px;background:var(--card);min-height:64px;padding:7px 2px;color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}.daybtn .dow{font-size:10px;text-transform:uppercase;color:var(--muted);letter-spacing:.07em}.daybtn .num{font-size:19px;font-weight:750}.daybtn .dot{width:5px;height:5px;border-radius:100%;background:var(--aqua)}.daybtn.selected{border-color:var(--aqua);background:var(--aqua);color:#062224}.daybtn.selected .dow{color:#143739}.daybtn.selected .dot{background:#173638}.datePanel{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:11px;margin-bottom:10px}.dateTop{display:flex;align-items:center;justify-content:space-between;gap:8px}.dateTop .month{font-weight:800;font-size:15px}.monthControls{display:flex;gap:7px}.navbtn{padding:6px 11px}.calendar{display:none;grid-template-columns:repeat(7,1fr);gap:3px;margin-top:11px}.calendar.open{display:grid}.calendar .weekday{text-align:center;color:var(--muted);font-size:11px;padding:7px 0}.calendar button{background:transparent;color:var(--ink);border:1px solid transparent;border-radius:7px;min-height:40px;position:relative}.calendar button.mark:after{content:' ';position:absolute;bottom:2px;left:calc(50% - 2px);width:4px;height:4px;background:var(--aqua);border-radius:50%}.calendar button.chosen{background:var(--aqua);color:#082427}.calendar button.chosen:after{background:#082427}.searchRow{display:flex;gap:8px;margin:12px 0 9px}.searchRow input{flex:1;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:12px;color:var(--ink);font-size:16px}.searchRow input:focus,select:focus,button:focus-visible{outline:2px solid var(--aqua);outline-offset:2px}.filterToggle{background:var(--card);border:1px solid var(--line);color:var(--ink);padding:10px;border-radius:10px}.quick{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}.quick button{color:var(--muted);background:var(--card);border:1px solid var(--line);border-radius:18px;padding:7px 12px;font-size:12px}.quick button.active{color:#092124;background:var(--aqua);border-color:var(--aqua);font-weight:750}.filters{display:none;gap:8px;grid-template-columns:1fr 1fr;margin-bottom:12px}.filters.open{display:grid}.filters select{width:100%;padding:10px;background:var(--card);border:1px solid var(--line);border-radius:9px;color:var(--ink)}.resultsTop{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:14px 0 8px}.resultsTop h2{font-size:19px;margin:0}.dateSection{scroll-margin-top:12px}.dateHead{font-size:15px;letter-spacing:-.01em;font-weight:800;padding:17px 0 8px;display:flex;justify-content:space-between;align-items:center;gap:10px}.dateHead span{font-size:12px;font-weight:400;color:var(--muted)}.event{display:grid;grid-template-columns:94px minmax(0,1fr);background:var(--card);border:1px solid var(--line);border-radius:13px;overflow:hidden;margin-bottom:9px;min-height:114px}.thumb{background:#143036;display:flex;align-items:center;justify-content:center;color:var(--aqua);font-size:33px;min-height:114px;overflow:hidden}.thumb img{width:100%;height:100%;object-fit:cover;display:block;aspect-ratio:1/1}.details{padding:11px 12px;min-width:0}.details h3{font-size:15px;line-height:1.32;margin:0 0 5px;overflow-wrap:anywhere}.details .time{color:var(--aqua);font-weight:750;font-size:13px}.details .venue{color:var(--muted);font-size:12px;margin-top:3px}.details .desc{font-size:12px;color:var(--muted);margin:7px 0 0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-line}.details .eventLink{font-size:12px;display:inline-block;margin-top:8px;font-weight:700;text-decoration:none}.more{display:block;margin:22px auto;background:var(--card2);color:var(--ink);border:1px solid var(--line);border-radius:11px;padding:11px 25px}.message{background:var(--card);color:var(--muted);padding:12px;border-radius:10px;font-size:12px;margin:10px 0}.message.error{color:#ffb5a9}.foot{font-size:11px;color:var(--muted);margin-top:25px}@media(min-width:660px){.wrap{padding:20px 25px 70px}.daybtn{min-height:72px}.event{grid-template-columns:118px 1fr;min-height:128px}.thumb{min-height:128px}.details h3{font-size:17px}.details{padding:15px}.details .venue,.details .desc{font-size:13px}}@media(max-width:355px){.daybtn .num{font-size:17px}.daybtn{min-height:55px}.event{grid-template-columns:82px 1fr}}

/* Mobile-friendly event thumbnails: preserve the complete original artwork. */
.event{grid-template-columns:112px minmax(0,1fr);align-items:start;min-height:112px}
.thumb{width:112px;height:112px;min-height:0;align-self:start;background:#15252a;overflow:hidden}
.thumb img{width:100%;height:100%;aspect-ratio:auto;object-fit:contain;object-position:center;display:block}
@media(min-width:660px){.event{grid-template-columns:128px minmax(0,1fr);min-height:128px}.thumb{width:128px;height:128px;min-height:0}}
@media(max-width:355px){.event{grid-template-columns:92px minmax(0,1fr);min-height:92px}.thumb{width:92px;height:92px}}

/* Compact mobile cards: expand details only when requested. */
.details .venue{margin-top:5px;line-height:1.35}
.details .eventExtra{margin-top:8px;font-size:12px;color:var(--muted)}
.details .eventExtra summary{display:inline-block;list-style:none;color:var(--aqua);font-size:12px;font-weight:700;cursor:pointer;padding:3px 0}
.details .eventExtra summary::-webkit-details-marker{display:none}
.details .eventExtra summary::after{content:' ▾'}
.details .eventExtra[open] summary::after{content:' ▴'}
.details .eventExtra .extraContent{margin:8px 0 0;white-space:pre-line;line-height:1.45;overflow-wrap:anywhere}
.details .eventExtra .address{margin:0 0 5px;white-space:normal}
.details .eventExtra .extraContent p{margin:0 0 7px}
.details .eventLink{margin-top:6px}
.details .eventActions{display:block;margin-top:6px}
.details .eventActions .eventExtra{margin:0;min-width:0}
.details .eventActions .eventLink{display:inline-block;margin:4px 0 0;white-space:normal;font-size:12px}
.details .eventActions .separator{color:var(--muted);font-size:12px}
.details .eventActions .eventExtra[open]{display:block}
.details .eventActions .eventExtra[open] .extraContent{margin-top:7px}

@media(min-width:660px){.details .eventExtra,.details .eventExtra summary{font-size:13px}}
.details .eventExtra .extraContent .eventLink{display:inline-block;margin:5px 12px 2px 0;color:var(--aqua);font-weight:750}
</style></head><body><main class="wrap"><div class="toolbar"><div><h1>Live Jazz Calendar</h1><div class="micro" id="subTitle">Browse shows by date or search</div></div><button class="todayBtn" id="today">Today</button></div><div id="weekStrip" class="weekStrip" aria-label="Select a date"></div><div class="datePanel"><div class="dateTop"><button class="minor" id="toggleMonth" aria-expanded="false">▦ Full month ▾</button><span class="month" id="monthName"></span><div class="monthControls"><button class="navbtn" id="prev" aria-label="Previous week">‹</button><button class="navbtn" id="next" aria-label="Next week">›</button></div></div><div class="calendar" id="calendar"></div></div><div class="searchRow"><input id="search" type="search" aria-label="Search events" placeholder="Search musician or venue…"><button class="filterToggle" id="filterToggle" aria-expanded="false">Filters ⚙</button></div><div class="filters" id="filters"><select id="area" aria-label="Area"><option value="all">All areas</option><option value="oklahoma city">Oklahoma City</option><option value="edmond">Edmond</option><option value="norman">Norman</option><option value="other">Other areas</option></select><select id="venue" aria-label="Venue"><option value="all">All venues</option></select></div><div class="quick" id="quick"><button data-mode="upcoming" class="active">Upcoming</button><button data-mode="today">Today</button><button data-mode="tomorrow">Tomorrow</button><button data-mode="weekend">This weekend</button><button data-mode="all">All dates</button></div><div class="resultsTop"><h2 id="heading">Upcoming performances</h2><span class="micro" id="count">Loading…</span></div><div id="notice" class="message">Connecting to the jazz calendar…</div><div id="results" aria-live="polite"></div><button id="more" class="more" hidden>Show more shows ↓</button><div class="foot">Event listings from <a href="https://okcjazz.life/shows-and-events" target="_blank" rel="noopener">OKC Jazz Life</a>. Confirm details with the venue.</div></main><script>
(()=>{'use strict';
const FEED='https://ronvaughn186.github.io/okcjazz-data/events.json', $=id=>document.getElementById(id), state={events:[],week:null,month:null,selected:null,mode:'upcoming',term:'',area:'all',venue:'all',limit:24,ready:false};
function ct(){const d=new Intl.DateTimeFormat('en-US',{timeZone:'America/Chicago',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());const get=k=>d.find(x=>x.type===k).value;return `${get('year')}-${get('month')}-${get('day')}`}
const utc=s=>new Date(s+'T12:00:00Z'),plus=(s,n)=>{let d=utc(s);d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)},fmt=(s,opt)=>new Intl.DateTimeFormat('en-US',{timeZone:'UTC',...opt}).format(utc(s)),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),url=v=>{try{let u=new URL(v);return ['http:','https:'].includes(u.protocol)?u.href:null}catch{return null}},time=v=>{if(!v)return'Time TBA';let m=v.match(/T(\d\d):(\d\d)/);if(!m)return'Time TBA';return`${Number(m[1])%12||12}:${m[2]} ${Number(m[1])>=12?'PM':'AM'}`};
const weekStart=s=>plus(s,-utc(s).getUTCDay()),wknd=()=>{let t=ct(),fri=plus(t,(5-utc(t).getUTCDay()+7)%7);return [fri,plus(fri,2)]};
function matches(e){let t=ct(),[fri,sun]=wknd();if(state.selected&&e.date<state.selected)return false;if(!state.selected){if(state.mode==='upcoming'&&e.date<t)return false;if(state.mode==='today'&&e.date!==t)return false;if(state.mode==='tomorrow'&&e.date!==plus(t,1))return false;if(state.mode==='weekend'&&(e.date<fri||e.date>sun))return false}if(state.area!=='all'){const l=(e.location||'').toLowerCase();let a=l.includes('edmond')?'edmond':l.includes('norman')?'norman':l.includes('oklahoma city')||l.includes('okc')?'oklahoma city':'other';if(a!==state.area)return false}if(state.venue!=='all'&&e.venue!==state.venue)return false;if(state.term&&!`${e.title||''} ${e.venue||''} ${e.location||''} ${e.description||''}`.toLowerCase().includes(state.term))return false;return true}
function renderWeek(){let t=ct(),html='';for(let i=0;i<7;i++){let d=plus(state.week,i),n=state.events.filter(e=>e.date===d).length,chosen=(state.selected||t)===d;html+=`<button class="daybtn ${chosen?'selected':''}" data-date="${d}" aria-label="${fmt(d,{weekday:'long',month:'short',day:'numeric'})}${n?', '+n+' events':''}" aria-pressed="${chosen}"><span class="dow">${fmt(d,{weekday:'short'})}</span><span class="num">${Number(d.slice(8))}</span>${n?'<span class="dot"></span>':''}</button>`} $('weekStrip').innerHTML=html;$('monthName').textContent=fmt(plus(state.week,3),{month:'long',year:'numeric'})}
function renderMonth(){let [y,m]=state.month.split('-').map(Number),first=new Date(Date.UTC(y,m-1,1)).getUTCDay(),days=new Date(Date.UTC(y,m,0)).getUTCDate(),counts=new Set(state.events.map(e=>e.date)),html='';for(let w of ['S','M','T','W','T','F','S'])html+=`<div class="weekday">${w}</div>`;for(let i=0;i<first;i++)html+='<div></div>';for(let n=1;n<=days;n++){let d=state.month+'-'+String(n).padStart(2,'0');html+=`<button data-date="${d}" class="${counts.has(d)?'mark ':''}${state.selected===d?'chosen':''}" aria-label="${fmt(d,{month:'long',day:'numeric'})}">${n}</button>`}$('calendar').innerHTML=html}
function compactLocation(location,venue){
  let loc=String(location||'').trim(), name=String(venue||'').trim();
  if(name&&loc.toLowerCase().startsWith(name.toLowerCase())){
    const rest=loc.slice(name.length);
    if(!rest||/^[,\s—–:|-]/.test(rest)) loc=rest.replace(/^[\s,;:|—–-]+/,'').trim()||name;
  }
  return loc;
}
function renderEvents(){const items=state.events.filter(matches),cut=items.slice(0,state.limit);$('count').textContent=state.ready?`${items.length} shows`:'';$('heading').textContent=state.selected?`From ${fmt(state.selected,{month:'short',day:'numeric'})}`:state.mode==='today'?'Today’s shows':state.mode==='tomorrow'?'Tomorrow’s shows':state.mode==='weekend'?'This weekend':state.mode==='all'?'All performances':'Upcoming performances';let html='',last='';for(let e of cut){if(e.date!==last){last=e.date;html+=`<section class="dateSection" id="day-${e.date}"><div class="dateHead">${fmt(e.date,{weekday:'long',month:'long',day:'numeric'})}<span>${items.filter(x=>x.date===e.date).length} shows</span></div></section>`}let img=url(e.image_url),ticket=url(e.ticket_url),reservation=url(e.reservation_url);html+=`<article class="event"><div class="thumb">${img?`<img src="${esc(img)}" loading="lazy" alt="" onerror="this.replaceWith(document.createTextNode('♫'))">`:'♫'}</div><div class="details"><h3>${esc(e.title)}</h3><div class="time">${esc(time(e.start))}</div><div class="venue">${esc(e.venue||'Venue TBA')}</div><div class="eventActions"><details class="eventExtra"><summary>Read more</summary><div class="extraContent">${e.location&&e.location.trim()!==(e.venue||'').trim()?`<p class="address"><strong>Location:</strong> ${esc(compactLocation(e.location,e.venue))}</p>`:''}${e.description?`<p>${esc(e.description)}</p>`:''}${ticket?`<a class="eventLink" href="${esc(ticket)}" target="_blank" rel="noopener noreferrer">Get tickets ↗</a>`:''}${reservation?`<a class="eventLink" href="${esc(reservation)}" target="_blank" rel="noopener noreferrer">Reservations ↗</a>`:''}${!ticket&&!reservation&&!e.description&&!e.location?'<p>No additional details available.</p>':''}</div></details></div></div></article>`}$('results').innerHTML=html||'<div class="message">No performances match this selection. Try another date or search.</div>';$('more').hidden=cut.length>=items.length;}
function render(){renderWeek();renderMonth();renderEvents()}
function selectDate(d){state.selected=d;state.mode='upcoming';state.limit=24;state.week=weekStart(d);state.month=d.slice(0,7);document.querySelectorAll('[data-mode]').forEach(b=>b.classList.remove('active'));render();document.querySelector('.resultsTop').scrollIntoView({behavior:'smooth',block:'start'})}
function mode(m){state.mode=m;state.selected=null;state.limit=24;const d=m==='tomorrow'?plus(ct(),1):m==='weekend'?wknd()[0]:ct();state.week=weekStart(d);state.month=d.slice(0,7);document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode===m));render()}
$('weekStrip').addEventListener('click',e=>{let b=e.target.closest('[data-date]');if(b)selectDate(b.dataset.date)});$('calendar').addEventListener('click',e=>{let b=e.target.closest('[data-date]');if(b){selectDate(b.dataset.date);$('calendar').classList.remove('open');$('toggleMonth').setAttribute('aria-expanded','false');$('toggleMonth').textContent='▦ Full month ▾'}});$('prev').addEventListener('click',()=>{state.week=plus(state.week,-7);state.month=plus(state.week,3).slice(0,7);renderWeek();renderMonth()});$('next').addEventListener('click',()=>{state.week=plus(state.week,7);state.month=plus(state.week,3).slice(0,7);renderWeek();renderMonth()});$('today').addEventListener('click',()=>mode('today'));$('toggleMonth').addEventListener('click',()=>{let open=$('calendar').classList.toggle('open');$('toggleMonth').setAttribute('aria-expanded',String(open));$('toggleMonth').textContent=open?'▦ Hide month ▴':'▦ Full month ▾'});$('filterToggle').addEventListener('click',()=>{let open=$('filters').classList.toggle('open');$('filterToggle').setAttribute('aria-expanded',String(open))});document.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>mode(b.dataset.mode)));$('search').addEventListener('input',e=>{state.term=e.target.value.trim().toLowerCase();state.limit=24;renderEvents()});$('area').addEventListener('change',e=>{state.area=e.target.value;state.limit=24;renderEvents()});$('venue').addEventListener('change',e=>{state.venue=e.target.value;state.limit=24;renderEvents()});$('more').addEventListener('click',()=>{state.limit+=24;renderEvents()});
state.week=weekStart(ct());state.month=ct().slice(0,7);renderWeek();renderMonth();fetch(FEED,{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()}).then(data=>{if(!data.complete_pagination||!Array.isArray(data.events)||!data.events.length)throw Error('Incomplete calendar data');state.events=data.events.slice().sort((a,b)=>a.date.localeCompare(b.date)||(a.start||'').localeCompare(b.start)||a.title.localeCompare(b.title));state.ready=true;$('notice').hidden=true;const venues=[...new Set(state.events.map(e=>e.venue).filter(Boolean))].sort();$('venue').innerHTML='<option value="all">All venues</option>'+venues.map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join('');$('subTitle').textContent=`${state.events.length} jazz listings · Select a date or scroll`;render()}).catch(e=>{$('notice').classList.add('error');$('notice').textContent='The live calendar could not be loaded ('+e.message+'). Try again later.';$('count').textContent='Unavailable'});
})();
</script>
<!-- Communicate the calendar's natural height to its Bandzoogle embed. -->
<script>
(() => {
  'use strict';
  const main = document.querySelector('main.wrap');
  if (!main || window.parent === window) return;
  let frame = 0;
  function reportHeight() {
    if (frame) cancelAnimationFrame(frame);
    frame = requestAnimationFrame(() => {
      frame = 0;
      const height = Math.ceil(Math.max(
        main.getBoundingClientRect().bottom + window.scrollY,
        main.scrollHeight + main.offsetTop
      )) + 4;
      window.parent.postMessage({ type: 'okcjazz-calendar-height', height }, '*');
    });
  }
  if ('ResizeObserver' in window) new ResizeObserver(reportHeight).observe(main);
  window.addEventListener('load', reportHeight);
  window.addEventListener('resize', reportHeight);
  document.addEventListener('toggle', reportHeight, true);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(reportHeight);
  reportHeight();
})();
</script>
</body></html>
